name: Release

# Triggered by pushing a version tag (created by `just release`). Builds the
# distribution, publishes to PyPI via trusted publishing (OIDC — no stored
# tokens), and cuts a GitHub Release whose notes come from CHANGELOG.md.
on:
  push:
    tags:
      - "v*"

jobs:
  # The full CI gate (same matrix as ci.yml) must be green before anything is
  # built or published — a tag can no longer ship what CI would reject.
  ci:
    uses: ./.github/workflows/ci.yml

  # The tag must match the packaged version, or the run stops before building —
  # otherwise tag vX.Y.Z on a stale __version__ publishes the wrong artifact
  # under the right release name.
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag matches __version__
        run: |
          version=$(python -c "import cognitive_complexity as c; print(c.__version__)")
          [ "$GITHUB_REF_NAME" = "v$version" ] || {
            echo "tag $GITHUB_REF_NAME != package version $version"; exit 1; }

  build:
    needs: [ci, version-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the PyPI pending-publisher config and the GitHub environment.
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release
    steps:
      - uses: actions/checkout@v6
      - name: Extract this version's changelog section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## \[$version\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no '## [$version]' section in CHANGELOG.md"; exit 1; }
          echo "Release notes for $version:"; cat notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md

notes = """\
Three accumulators (total/count/weight) are read AND written in the region via \
`+=` and returned. Extracting the region would need all three threaded in and out \
(coupling 7 > _MAX_COUPLING), so the engine must NOT suggest extract_helper. This \
only holds once `_analyze_coupling` counts an AugAssign target as both a read and a \
write; before that fix the accumulators counted as outputs only (coupling 4) and \
extract_helper wrongly fired.\
"""

source = "flatten_else_after_return negative: non-terminal if body"
notes = """\
The outer if body does NOT always terminate: `if strict: return -1` falls \
through when strict is False. Dropping the else would silently change behaviour \
(the else body would run even when n<0 and strict is False). The detector must \
stay silent.\
"""
